site_name: gestao.one — Docs técnicas
site_description: Documentação técnica e de operação por módulo (app-cam, app-not, app-cms).
site_url: https://renatofagalde.github.io/wiki/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Uso do sistema:
      - Visão geral: uso-do-sistema/index.md
      - Cookbook — do zero à comissão paga: uso-do-sistema/cookbook.md
  - AWS:
      - Contas & switch role: aws/contas-e-switch-role.md
  - app-cam:
      - Visão geral: app-cam/index.md
      - Logs & CloudWatch: app-cam/logs-cloudwatch.md
      - Consultas SQL: app-cam/consultas-sql.md
      - Casos resolvidos: app-cam/casos.md
  - app-not:
      - Visão geral: app-not/index.md
  - app-cms:
      - Visão geral: app-cms/index.md
