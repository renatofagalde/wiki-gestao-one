site_name: gestao.one — Guia de uso
site_description: Guias de uso do gestao.one para dono de corretora, gerente, financeiro e vendedor.
site_url: https://renatofagalde.github.io/wiki-gestao-one/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Uso do sistema:
      - Visão geral: uso-do-sistema/index.md
      - Cookbook — do zero à comissão paga: uso-do-sistema/cookbook.md
      - "Passo 1 (visual): convidar": uso-do-sistema/passo1-convidar.md
