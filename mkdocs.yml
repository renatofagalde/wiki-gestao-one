site_name: gestao.one — Guia de uso
site_description: Guias de uso do gestao.one para dono de corretora, gerente, financeiro e vendedor.
site_url: https://renatofagalde.github.io/wiki-gestao-one/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Cookbook:
      - Visão geral: cookbook/index.md
      - Corretora:
          - Visão geral: cookbook/corretora/index.md
          - 1 · Criar sua conta: cookbook/corretora/01-criar-conta.md
          - 2 · Aceitar o convite: cookbook/corretora/02-esperar-convite.md
          - 3 · Convidar a equipe: cookbook/corretora/03-convidar.md
          - 4 · Atribuir perfil de acesso: cookbook/corretora/04-perfil-acesso.md
          - 5 · Criar um time: cookbook/corretora/05-time.md
          - 6 · Plano de comissionamento: cookbook/corretora/06-plano.md
          - 7 · Lead vira proposta: cookbook/corretora/07-lead-proposta.md
          - 8 · Confirmar e ver o resultado: cookbook/corretora/08-confirmar-resultado.md
      - WebFlow: cookbook/webflow.md
      - TISS: cookbook/tiss.md
